plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id 'maven-publish'
    id 'signing'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

group = 'se.fearless'
base {
    archivesName = "fettle"
}
version = '1.0.0-SNAPSHOT'

defaultTasks 'build'

repositories {
    mavenCentral()
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation 'org.hamcrest:hamcrest:2.2'
	testImplementation 'org.slf4j:slf4j-api:2.0.16'
	testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.13'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('gwtJar', Jar) {
	dependsOn tasks.classes
	archiveClassifier = 'gwt'
	from sourceSets.main.output.classesDirs
    exclude("**/export/DotExporter*", "**/util/PredicateCondition*")
    into('se/fearless/fettle/super') {
        from sourceSets.main.allJava

    }
    into('se/fearless/fettle') {
        from sourceSets.main.resources
        exclude("**/export*")
    }
}

tasks.named('jar', Jar) {
    exclude("**/*.xml")
}

tasks.named('checkstyleMain') {
    doLast {
        def reportsDir = layout.buildDirectory.dir("reports/checkstyle").get().asFile
        def xmlReport = new File(reportsDir, "main.xml")
        if (xmlReport.exists()) {
            ant.xslt(in: xmlReport,
                    style: "config/checkstyle/checkstyle.xsl",
                    out: new File(reportsDir, "checkstyle.html").absolutePath
            )
        }
    }
}

tasks.named('checkstyleTest') {
    ignoreFailures = true
}

tasks.named('jacocoTestReport') {
    reports {
        html.required = true
        csv.required = false
        xml.required = false
    }
    additionalSourceDirs.from(files(sourceSets.main.allJava.srcDirs))
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Mockito's ByteBuddy and CompleteCoverageTest's setAccessible() need this on Java 21+.
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact(tasks.named('gwtJar'))

            pom {
                name = 'Fettle'
                description = 'Fettle is a state machine framework for java'
                url = 'https://thehiflyer.github.com/Fettle/'

                scm {
                    url = 'https://github.com/thehiflyer/Fettle.git'
                    connection = 'scm:git:https://github.com/thehiflyer/Fettle.git'
                    developerConnection = 'scm:git:https://github.com/thehiflyer/Fettle.git'
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://www.opensource.org/licenses/mit-license.php'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'hiflyer'
                        name = 'Per Malmen'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'sonatype'
            def releases = uri('https://oss.sonatype.org/service/local/staging/deploy/maven2/')
            def snapshots = uri('https://oss.sonatype.org/content/repositories/snapshots/')
            url = version.toString().endsWith('SNAPSHOT') ? snapshots : releases
            credentials {
                username = findProperty('sonatypeUsername') ?: ''
                password = findProperty('sonatypePassword') ?: ''
            }
        }
    }
}

signing {
    required = !version.toString().endsWith('SNAPSHOT')
    sign publishing.publications.mavenJava
}

tasks.withType(Sign).configureEach {
    onlyIf("Only sign when publishing a release") {
        !version.toString().endsWith('SNAPSHOT') &&
        gradle.taskGraph.allTasks.any { it.name.startsWith('publish') }
    }
}

artifacts {
    add('default', tasks.named('gwtJar'))
}